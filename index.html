<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Chimoon 🌔</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #ffeaf2);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        text-align: center;
    }

    .page {
        display: none;
        width: 100%;
        padding: 25px;
        animation: fadeIn 0.6s ease;
    }

    .page.active {
        display: block;
    }

    h1 {
        color: #ff4f81;
        font-size: clamp(2rem, 8vw, 4rem);
        margin-bottom: 30px;
    }

    p {
        color: #555;
        font-size: clamp(1rem, 4vw, 1.4rem);
        margin-bottom: 30px;
    }

    button {
        border: none;
        border-radius: 50px;
        padding: 15px 30px;
        font-size: 1.2rem;
        font-weight: bold;
        cursor: pointer;
        transition: transform 0.25s ease, padding 0.25s ease;
    }

    .yes {
        background: #ff4f81;
        color: white;
        position: relative;
        z-index: 5;
        transition: transform 0.35s ease;
    }

    .no {
        background: #ddd;
        color: #555;
        position: fixed;
        z-index: 10;
        transition: transform 0.35s ease, left 0.25s ease, top 0.25s ease;
    }

    .open {
        background: #ff4f81;
        color: white;
    }

    .heart {
        font-size: 5rem;
        animation: pulse 1.2s infinite;
        margin-bottom: 20px;
    }

    .floating-heart {
        position: fixed;
        bottom: -30px;
        font-size: 25px;
        animation: floatUp 5s linear forwards;
        pointer-events: none;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }
        50% {
            transform: scale(1.15);
        }
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: scale(0.9);
        }
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    @keyframes floatUp {
        from {
            transform: translateY(0) rotate(0deg);
            opacity: 1;
        }
        to {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    @media (max-width: 600px) {
        button {
            padding: 13px 25px;
            font-size: 1rem;
        }

        .heart {
            font-size: 4rem;
        }
    }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <h1>Question to my chimoon 🌔</h1>
    <div class="heart">❤️</div>
    <button class="open" onclick="nextPage(2)">Open ❤️</button>
</div>


<!-- PAGE 2 -->
<div class="page" id="page2">
    <h1>Will you be my girlfriend?</h1>

    <button class="yes" id="yes1" onclick="nextPage(3)">YES ❤️</button>
    <button class="no" id="no1">NO</button>
</div>


<!-- PAGE 3 -->
<div class="page" id="page3">
    <h1>Are you sure?</h1>
    <p>Think carefully... ❤️</p>

    <button class="yes" id="yes2" onclick="nextPage(4)">YES ❤️</button>
    <button class="no" id="no2">NO</button>
</div>


<!-- PAGE 4 -->
<div class="page" id="page4">
    <h1>Wait... really???</h1>
    <p>You actually said yes?</p>

    <button class="open" onclick="nextPage(5)">I REALLY DID ❤️</button>
</div>


<!-- PAGE 5 -->
<div class="page" id="page5">
    <div class="heart">❤️</div>
    <h1>You just made me the luckiest man ever.</h1>
    <h1>I love you ❤️</h1>
</div>


<script>
    function nextPage(pageNumber) {
        document.querySelectorAll(".page").forEach(page => {
            page.classList.remove("active");
        });

        document.getElementById("page" + pageNumber).classList.add("active");

        if (pageNumber === 5) {
            createHearts();
        }
    }


    function setupNoButton(noId, yesId) {
        const noButton = document.getElementById(noId);
        const yesButton = document.getElementById(yesId);

        let attempts = 0;

        function moveButton() {
            attempts++;

            // Move NO button to a random safe position
            const maxX = window.innerWidth - noButton.offsetWidth - 20;
            const maxY = window.innerHeight - noButton.offsetHeight - 20;

            const x = Math.max(10, Math.random() * maxX);
            const y = Math.max(10, Math.random() * maxY);

            noButton.style.left = x + "px";
            noButton.style.top = y + "px";

            /*
             * NO gets smaller each time.
             */
            const noScales = [
                0.85,
                0.68,
                0.52,
                0.38,
                0.27,
                0.19,
                0.13
            ];

            /*
             * YES gets MUCH bigger each time.
             */
            const yesScales = [
                1.15,
                1.35,
                1.60,
                1.90,
                2.25,
                2.65,
                3.10
            ];

            const noScale =
                noScales[Math.min(attempts - 1, noScales.length - 1)];

            const yesScale =
                yesScales[Math.min(attempts - 1, yesScales.length - 1)];

            noButton.style.transform = `scale(${noScale})`;
            yesButton.style.transform = `scale(${yesScale})`;
        }

        // Desktop
        noButton.addEventListener("mouseenter", moveButton);

        // Mobile
        noButton.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveButton();
        });
    }


    setupNoButton("no1", "yes1");
    setupNoButton("no2", "yes2");


    function createHearts() {
        for (let i = 0; i < 30; i++) {
            setTimeout(() => {
                const heart = document.createElement("div");

                heart.className = "floating-heart";
                heart.innerHTML = ["❤️", "💕", "💗", "💖", "💘"][
                    Math.floor(Math.random() * 5)
                ];

                heart.style.left = Math.random() * 100 + "vw";
                heart.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 6000);

            }, i * 150);
        }
    }
</script>

</body>
</html>
